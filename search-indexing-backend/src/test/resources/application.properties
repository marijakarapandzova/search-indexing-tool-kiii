spring.datasource.url=jdbc:h2:mem:searchindex
spring.datasource.username=emc
spring.datasource.password=emc

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer

vezilka.base-url=https://doniraj.vezilka.ai
vezilka.api-key=

crawler.max-pages-per-job=100
crawler.same-domain-only=true
crawler.request-delay-ms=0
crawler.user-agent=EMC-SearchIndexingBot/1.0

search.index-path=./data/search-index
search.uri=
search.index-name=documents

spring.h2.console.enabled=true
spring.h2.console.path=/h2
